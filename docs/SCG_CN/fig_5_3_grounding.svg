<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="图 5.3 三档依据门控">
<rect width="1920" height="1080" fill="#ffffff"/>
<text x="960.0" y="64.0" font-size="30" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">三档依据门控</text>
<rect x="680.0" y="133.0" width="560.0" height="96.0" rx="10" ry="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2.2"/>
<text x="960.0" y="188.0" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">检索得分前两名  s₁ 、 s₂</text>
<rect x="600.0" y="281.0" width="720.0" height="110.0" rx="10" ry="10" fill="#f8fafc" stroke="#475569" stroke-width="1.8"/>
