<text x="960.0" y="1016.0" font-size="17" font-weight="400" fill="#475569" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">Teachers write the KB; students read it. Session files stay out of the shared corpus.</text>
