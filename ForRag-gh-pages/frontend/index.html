<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文档问答 · 对话</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="app-shell">
    <aside class="sidebar" aria-label="导览与文档">
        <div class="sidebar-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" width="28" height="28">
                <rect x="2" y="2" width="28" height="28" rx="7" fill="#1a1a1a"/>
                <path d="M10 22V10l6 8 6-8v12" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        <nav class="sidebar-rail" aria-label="页面切换">
            <a href="index.html" class="rail-link active" title="对话">
                <span class="rail-link-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                </span>
            </a>
            <a href="kb.html" class="rail-link" title="知识库">
                <span class="rail-link-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M8 7h8"/><path d="M8 11h8"/></svg>
                </span>
            </a>
            <a href="quiz.html" class="rail-link" title="巩固测验">
                <span class="rail-link-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M8 7h8M8 11h6"/></svg>
                </span>
            </a>
        </nav>
        <div class="sidebar-upload">
            <div class="upload-zone compact" id="uploadZone">
                <div class="upload-content">
                    <p>上传文档</p>
                    <span class="hint">拖拽或点击</span>
                </div>
                <input type="file" id="fileInput" multiple hidden>
            </div>
            <div class="file-list" id="fileList"></div>
        </div>
    </aside>

    <main class="main-panel">
        <header class="main-toolbar">
            <span class="main-toolbar-spacer"></span>
            <div class="main-toolbar-actions">
                <button type="button" class="icon-tool-btn" id="attachFromToolbarBtn" title="添加文档">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                        <line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/>
                    </svg>
                </button>
                <button type="button" class="icon-tool-btn" id="scrollChatHistoryBtn" title="回到对话记录顶部">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                    </svg>
                </button>
            </div>
        </header>

        <div class="chat-main-inner">
            <section class="chat-section">
                <div class="welcome-hero" id="welcomeHero">
                    <div class="welcome-hero-icon" aria-hidden="true">
                        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" width="56" height="56">
                            <circle cx="32" cy="32" r="30" stroke="#e0e0e0" stroke-width="1.5"/>
                            <path d="M22 28c0-5.5 4.5-10 10-10s10 4.5 10 10v4c0 2-1 4-3 5" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
                            <circle cx="26" cy="30" r="2" fill="#1a1a1a"/>
                            <circle cx="38" cy="30" r="2" fill="#1a1a1a"/>
                            <path d="M28 40c2 2 6 2 8 0" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <h2 class="welcome-title">你好，我是你的AI助手</h2>
                    <p class="welcome-sub">上传左侧文档或在知识库中整理笔记后，可选择检索范围进行提问。</p>
                </div>

                <div class="chat-toolbar">
                    <button type="button" id="clearChatBtn" class="chat-toolbar-btn" disabled>清空聊天记录</button>
                </div>
                <div id="chatMessages" class="chat-messages" aria-live="polite"></div>
                <div class="chat-generate-bar" id="generateBar">
                    <p class="generate-hint">是否根据对话生成练习题？勾选助手消息（可多选），并为每段设置「出题数」，点击下方「生成」后在测验页展示相应数量的题目（选择题为主，与历史题目不重复）。</p>
                    <button type="button" id="generateQuizBtn" class="submit-btn secondary-btn" disabled>生成测验</button>
                </div>

                <div class="retrieval-bar" id="retrievalBar" aria-label="检索范围">
                    <label>
                        检索范围
                        <select id="kbScopeSelect" title="选择参与向量检索的数据来源">
                            <option value="union" selected>会话文件 + 知识库</option>
                            <option value="session_files">仅会话上传文件</option>
                            <option value="kb_only">仅知识库</option>
                        </select>
                    </label>
                    <label>
                        限定知识库类目（可多选，留空表示全部）
                        <select id="kbCategoryFilter" multiple size="3" aria-label="类目筛选"></select>
                    </label>
                </div>

                <div class="composer-wrap">
                    <div class="composer-card" id="composerCard">
                        <textarea id="questionInput" placeholder="基于选定范围提问" rows="3"></textarea>
                        <div class="composer-footer">
                            <div class="composer-footer-left">
                                <button type="button" class="composer-circle-btn" id="composerAttachBtn" title="添加文档">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                                </button>
                                <span class="composer-pill composer-pill--static">
                                    <svg class="composer-pill-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
                                    学习辅导
                                </span>
                                <label class="composer-pill composer-pill--select">
                                    <span class="composer-pill-icons" aria-hidden="true">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                                    </span>
                                    <span class="visually-hidden">检索片段数</span>
                                    <select id="topKSelect" aria-label="检索片段数">
                                        <option value="1">1 段</option>
                                        <option value="3" selected>3 段</option>
                                        <option value="5">5 段</option>
                                        <option value="10">10 段</option>
                                    </select>
                                </label>
                            </div>
                            <button id="submitBtn" class="composer-send" type="button" disabled aria-label="发送">
                                <span class="btn-text">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="20" height="20" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
                                </span>
                                <span class="btn-loading" aria-hidden="true">
                                    <svg class="spinner" viewBox="0 0 24 24">
                                        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none" stroke-dasharray="60" stroke-linecap="round"/>
                                    </svg>
                                </span>
                            </button>
                        </div>
                    </div>
                    <div class="suggestion-row" id="suggestionRow" role="group" aria-label="快捷提问">
                        <button type="button" class="suggestion-chip" data-prompt="请根据已上传文档，帮我整理一份今日可执行的要点日报（分条、简洁）。">Get日报</button>
                        <button type="button" class="suggestion-chip" data-prompt="请用已上传材料中的依据，解释下面这个概念，并指出在文档中的相关位置：">解释特定概念</button>
                        <button type="button" class="suggestion-chip" data-prompt="请用费曼技巧带我学习：先用简单语言解释核心概念，再让我复述，最后指出我表述中的漏洞并纠正。">用费曼技巧学习</button>
                        <button type="button" class="suggestion-chip" data-prompt="请从已上传文档中找出支持以下结论或观点的原文依据（引用片段并说明页码或文件名）：">寻找理论依据</button>
                        <button type="button" class="suggestion-chip" data-prompt="请围绕我关心的主题，基于文档出若干道选择题（给出选项与正确答案），并附简短解析：">针对主题出题</button>
                    </div>
                </div>
            </section>

            <section class="result-section" id="resultSection">
                <div class="sources-card" id="sourcesCard">
                    <div class="card-header" id="sourcesHeader">
                        <h3>相关文档片段 <span class="count" id="sourcesCount"></span></h3>
                        <button type="button" class="toggle-btn" id="toggleSources" aria-expanded="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M6 9l6 6 6-6"/>
                            </svg>
                        </button>
                    </div>
                    <div class="card-body" id="sourcesBody">
                        <div class="notice-banner" id="kbNotice" style="display:none"></div>
                        <div class="sources-list" id="sourcesList"></div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <div class="toast" id="toast">
        <span class="toast-message"></span>
    </div>

    <script src="app.js"></script>
</body>
</html>
