<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识库</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="app-shell">
    <aside class="sidebar" aria-label="导览">
        <div class="sidebar-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" width="28" height="28">
                <rect x="2" y="2" width="28" height="28" rx="7" fill="#1a1a1a"/>
                <path d="M10 22V10l6 8 6-8v12" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        <nav class="sidebar-rail" aria-label="页面切换">
            <a href="index.html" class="rail-link" title="对话">
                <span class="rail-link-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                </span>
            </a>
            <a href="kb.html" class="rail-link active" title="知识库">
                <span class="rail-link-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M8 7h8"/><path d="M8 11h8"/></svg>
                </span>
            </a>
            <a href="quiz.html" class="rail-link" title="巩固测验">
                <span class="rail-link-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M8 7h8M8 11h6"/></svg>
                </span>
            </a>
        </nav>
    </aside>

    <main class="main-panel kb-page">
        <div class="kb-layout">
            <section class="kb-sidebar-panel">
                <h1 class="kb-page-title">知识库</h1>
                <div class="kb-toolbar">
                    <label>类目
                        <select id="categorySelect"></select>
                    </label>
                    <button type="button" id="btnNewCategory" class="chat-toolbar-btn">新建类目</button>
                    <button type="button" id="btnNewNote" class="chat-toolbar-btn">新建笔记</button>
                </div>
                <ul id="noteList" class="kb-note-list"></ul>
            </section>
            <section class="kb-editor-panel">
                <div class="kb-editor-head">
                    <input type="text" id="noteTitle" class="kb-title-input" placeholder="笔记标题">
                    <button type="button" id="btnSaveNote" class="submit-btn">保存</button>
                </div>
                <textarea id="noteBody" class="kb-body-textarea" placeholder="Markdown 正文…" rows="18"></textarea>
                <div class="kb-attach-zone">
                    <label class="kb-attach-label">附件 <input type="file" id="noteFile" hidden><button type="button" class="chat-toolbar-btn" id="btnPickFile">选择文件</button></label>
                    <div id="attachList" class="kb-attach-list"></div>
                </div>
                <p class="kb-hint">笔记与附件将参与「对话」页检索（默认与会话文件合并）。</p>
                <a href="index.html" class="link-btn">返回对话</a>
            </section>
        </div>
    </main>

    <div class="toast" id="toast"><span class="toast-message"></span></div>
    <script src="kb.js"></script>
    <script>
        document.getElementById('btnPickFile').addEventListener('click', () => document.getElementById('noteFile').click());
    </script>
</body>
</html>
